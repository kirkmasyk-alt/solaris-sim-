<script>
/* =====================================================================
   ORBITAL // HQ  PATCH v16.7  (paste as a 2nd <script> right before </body>)
   - Adds the missing AUDITOR-7 module (avatar + audit + ASK AI)
   - Fixes OpenAI council (null crash, fail-open approvals, weak prompt)
   - Adds PUMP.FUN mode + pump.fun feeds
   - Anti-chase logic so bots stop buying after the pump
   Everything is paper trading. No real funds move.
   ===================================================================== */

/* ---------- config ---------- */
CFG.majorStopPct = -4;
CFG.maxCh5m = 6;        // growth/sniper: skip if already up more than this in 5m
CFG.maxCh1h = 40;       // growth/sniper: skip if already up more than this in 1h
CFG.maxScanRun = 5;     // skip if up more than this % over the last ~3 scans
CFG.pump = {
  minMc: 6000, maxMc: 60000,        // pump.fun curve graduates ~ $69k mc
  minAgeMin: 3, maxAgeMin: 120,
  minLiq: 4000, minTxns: 30, minBuyRatio: 0.58,
  minTx5m: 6, minBuy5m: 0.55,       // flow must still be alive right now
  minCh5m: -4, maxCh5m: 20, maxCh1h: 150, maxScanRun: 12,
  entryPct: 0.05, baseSlippage: 0.02, maxSpendPctOfLiq: 0.03,
  stopPct: -12, recoverPct: 50, tier2Pct: 150, trailPct: 20,
  staleMin: 25, stalePct: 5, maxOpen: 4
};
Object.assign(TUNABLE, {
  maxCh5m: { min: 1, max: 30 },
  maxCh1h: { min: 10, max: 200 },
  maxScanRun: { min: 1, max: 30 },
  majorStopPct: { min: -15, max: -1 }
});
['majorStopPct', 'maxCh5m', 'maxCh1h', 'maxScanRun'].forEach(k => { CFG_DEFAULTS[k] = CFG[k]; });
CFG_DEFAULTS.pump = JSON.parse(JSON.stringify(CFG.pump));
Object.keys(state.overrides || {}).forEach(k => { if (TUNABLE[k] && isFinite(state.overrides[k])) CFG[k] = state.overrides[k]; });
ARCHIVE_MS['FLOW EXIT'] = 3 * HOUR;

/* ---------- error capture for the auditor ---------- */
window.addEventListener('error', e => { errorBuf.push(clock() + ' ' + (e.message || 'error')); if (errorBuf.length > 20) errorBuf.shift(); });
window.addEventListener('unhandledrejection', e => { errorBuf.push(clock() + ' ' + String((e.reason && e.reason.message) || e.reason)); if (errorBuf.length > 20) errorBuf.shift(); });
(function () {
  const ce = console.error;
  console.error = function () {
    try { errorBuf.push(clock() + ' ' + Array.prototype.map.call(arguments, a => (a && a.message) || String(a)).join(' ').slice(0, 160)); if (errorBuf.length > 20) errorBuf.shift(); } catch (e) {}
    return ce.apply(console, arguments);
  };
})();

/* ---------- coin parsing (adds 5-minute flow data) ---------- */
function toCoin(p) {
  if (!p || p.chainId !== 'solana' || !p.priceUsd || !p.baseToken || !p.baseToken.address) return null;
  const liquidity = (p.liquidity && p.liquidity.usd) || 0;
  const price = parseFloat(p.priceUsd);
  if (!(liquidity > 0) || !(price > 0)) return null;
  const symbol = cleanSymbol(p.baseToken.symbol);
  if (!symbol) return null;
  const pc = p.priceChange || {}, tx = (p.txns && p.txns.h1) || {}, tx5 = (p.txns && p.txns.m5) || {};
  return {
    address: p.baseToken.address, symbol, price, liquidity,
    change5m: pc.m5 || 0, change1h: pc.h1 || 0, change24h: pc.h24 || 0,
    volumeH1: (p.volume && p.volume.h1) || 0, volumeM5: (p.volume && p.volume.m5) || 0,
    buysH1: tx.buys || 0, sellsH1: tx.sells || 0, buysM5: tx5.buys || 0, sellsM5: tx5.sells || 0,
    ageMin: p.pairCreatedAt ? (Date.now() - p.pairCreatedAt) / 60000 : null,
    marketCap: p.marketCap || p.fdv || null,
    seenAt: Date.now()
  };
}

function toCoinGT(p) {
  const a = p && p.attributes;
  const baseId = p && p.relationships && p.relationships.base_token && p.relationships.base_token.data && p.relationships.base_token.data.id;
  if (!a || !baseId) return null;
  const address = String(baseId).replace(/^solana_/, '');
  const price = parseFloat(a.base_token_price_usd);
  const liquidity = parseFloat(a.reserve_in_usd);
  const symbol = cleanSymbol(String(a.name || '').split(' / ')[0]);
  if (!address || !(price > 0) || !(liquidity > 0) || !symbol) return null;
  const pc = a.price_change_percentage || {}, vol = a.volume_usd || {};
  const tx = (a.transactions && a.transactions.h1) || {}, tx5 = (a.transactions && a.transactions.m5) || {};
  const created = a.pool_created_at ? Date.parse(a.pool_created_at) : NaN;
  return {
    address, symbol, price, liquidity,
    change5m: parseFloat(pc.m5) || 0, change1h: parseFloat(pc.h1) || 0, change24h: parseFloat(pc.h24) || 0,
    volumeH1: parseFloat(vol.h1) || 0, volumeM5: parseFloat(vol.m5) || 0,
    buysH1: tx.buys || 0, sellsH1: tx.sells || 0, buysM5: tx5.buys || 0, sellsM5: tx5.sells || 0,
    ageMin: isNaN(created) ? null : (Date.now() - created) / 60000,
    marketCap: parseFloat(a.market_cap_usd) || parseFloat(a.fdv_usd) || null,
    seenAt: Date.now()
  };
}

/* ---------- price history across scans (detects "already ran") ---------- */
const priceHist = new Map();
function snapshotPrices() {
  market.forEach((c, a) => {
    let h = priceHist.get(a);
    if (!h) { h = []; priceHist.set(a, h); }
    const last = h[h.length - 1];
    if (!last || last.t !== c.seenAt) h.push({ t: c.seenAt, p: c.price });
    while (h.length > 6) h.shift();
  });
  if (priceHist.size > 400) priceHist.forEach((v, a) => { if (!market.has(a)) priceHist.delete(a); });
}
function scanRun(c) {
  const h = priceHist.get(c.address);
  if (!h || !h.length) return 0;
  const cutoff = Date.now() - 4 * 60000;
  const recent = h.filter(x => x.t >= cutoff);
  if (!recent.length || !(recent[0].p > 0)) return 0;
  return (c.price / recent[0].p - 1) * 100;
}

/* ---------- pump.fun ---------- */
function isPump(c) { return !!c && typeof c.address === 'string' && c.address.endsWith('pump'); }

function isPumpCandidate(c) {
  const P = CFG.pump;
  if (!isPump(c) || isMajorWave(c)) return false;
  if (c.ageMin === null || c.ageMin === undefined || c.ageMin < P.minAgeMin || c.ageMin > P.maxAgeMin) return false;
  if (!(c.marketCap > 0) || c.marketCap < P.minMc || c.marketCap > P.maxMc) return false;
  if (c.liquidity < P.minLiq) return false;
  const tx = c.buysH1 + c.sellsH1;
  if (tx < P.minTxns || c.buysH1 / tx < P.minBuyRatio) return false;
  const t5 = (c.buysM5 || 0) + (c.sellsM5 || 0);
  if (t5 < P.minTx5m || c.buysM5 / t5 < P.minBuy5m) return false;
  if (c.change5m > P.maxCh5m || c.change5m < P.minCh5m || c.change1h > P.maxCh1h) return false;
  if (c.change1h > 30 && c.change5m > 0.5 * c.change1h) return false;   // vertical candle = late
  if (scanRun(c) > P.maxScanRun) return false;
  return true;
}

function pumpScore(c) {
  const P = CFG.pump;
  const t5 = Math.max(1, (c.buysM5 || 0) + (c.sellsM5 || 0));
  const ext = Math.min(0.7, Math.max(0, c.change5m) / (P.maxCh5m * 1.5));
  return (c.buysM5 / t5) * Math.sqrt(t5) * (1 - ext);
}

async function pumpScan() {
  const GT = 'https://api.geckoterminal.com/api/v2/networks/solana';
  const lists = await Promise.all([
    feedJson('gt-pumpfun', `${GT}/dexes/pump-fun/pools?page=1&sort=h24_tx_count_desc`),
    feedJson('gt-pumpswap', `${GT}/dexes/pumpswap/pools?page=1&sort=h24_volume_usd_desc`)
  ]);
  lists.forEach(d => {
    if (d && Array.isArray(d.data)) d.data.forEach(p => { const c = toCoinGT(p); if (c && isPump(c)) market.set(c.address, c); });
  });
}

const _scanMarket = scanMarket;
scanMarket = async function () {
  if (scanning) return;
  try { snapshotPrices(); await pumpScan(); } catch (e) { console.warn('pumpScan', e); }
  return _scanMarket();
};

/* ---------- anti-chase entry rules ---------- */
function passesChaseGate(c) {
  if (isMajorWave(c)) return true;
  if (c.change5m > CFG.maxCh5m) return false;
  if (c.change1h > CFG.maxCh1h) return false;
  if (c.change5m < -4) return false;
  if (scanRun(c) > CFG.maxScanRun) return false;
  return true;
}

const _isBuyable = isBuyable;
isBuyable = function (c) {
  if (state.mode === 'PUMP') return classifyDipOrDump(c) !== 'DUMP' && isPumpCandidate(c);
  if (!_isBuyable(c)) return false;
  return state.mode === 'LAUNCH' ? true : passesChaseGate(c);
};

const _entryScore = entryScore;
entryScore = function (c) { return state.mode === 'PUMP' ? pumpScore(c) : _entryScore(c); };

// old score rewarded coins that had ALREADY pumped (1h change boost) -> late buys
function activityScore(c) {
  const tx = Math.max(1, c.buysH1 + c.sellsH1);
  const ext = Math.min(0.6, Math.max(0, c.change1h - 15) / 100);
  return (c.volumeH1 / c.liquidity) * (c.buysH1 / tx) * (1 - ext);
}

function slippage(usd, liquidity) {
  const base = state.mode === 'LAUNCH' ? CFG.launch.baseSlippage : state.mode === 'PUMP' ? CFG.pump.baseSlippage : CFG.baseSlippage;
  return base + Math.min(0.15, (2 * usd) / Math.max(1, liquidity));
}

function setTradingMode(mode) {
  state.mode = ['GROWTH', 'SNIPER', 'LAUNCH', 'PUMP'].includes(mode) ? mode : 'GROWTH';
  saveState();
  log(`[MODE] Operational mode: ${state.mode}`);
  renderAll();
}

function maxOpenNow() { return state.mode === 'PUMP' ? CFG.pump.maxOpen : CFG.maxOpenPositions; }

/* ---------- OpenAI council (fixed) ---------- */
async function askCouncilAI(coin) {
  const key = (localStorage.getItem('openai_api_key') || '').trim();
  if (!key || state.decision === 'AUTO') return { approve: true, reason: 'Auto mode approved' };
  if (councilBusy) return { approve: false, skip: true, reason: 'Council busy, retry next scan' };
  councilBusy = true;
  try {
    const tx = Math.max(1, coin.buysH1 + coin.sellsH1), t5 = Math.max(1, (coin.buysM5 || 0) + (coin.sellsM5 || 0));
    const info = {
      symbol: coin.symbol, mode: state.mode, pumpFun: isPump(coin),
      priceUsd: coin.price, liquidityUsd: Math.round(coin.liquidity), marketCapUsd: coin.marketCap ? Math.round(coin.marketCap) : null,
      ageMin: coin.ageMin === null || coin.ageMin === undefined ? null : Math.round(coin.ageMin),
      volume1hUsd: Math.round(coin.volumeH1), turnover1h: +(coin.volumeH1 / Math.max(1, coin.liquidity)).toFixed(2),
      buys1h: coin.buysH1, sells1h: coin.sellsH1, buyRatio1h: +(coin.buysH1 / tx).toFixed(2),
      buys5m: coin.buysM5 || 0, sells5m: coin.sellsM5 || 0, buyRatio5m: +((coin.buysM5 || 0) / t5).toFixed(2),
      change5mPct: coin.change5m, change1hPct: coin.change1h, change24hPct: coin.change24h,
      runLast3ScansPct: +scanRun(coin).toFixed(1), openPositions: heldAddrs().length, cashUsd: +state.cash.toFixed(2)
    };
    const sys = 'You are the risk council of a PAPER-TRADING Solana memecoin bot. Approve only EARLY, healthy momentum. Veto late entries (price already extended by big 5m/1h/3-scan pumps), fading 5m flow, thin liquidity, wash-trade looking turnover, or rug-like patterns. Respond ONLY with JSON: {"approve": boolean, "reason": string under 100 chars}.';
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: CFG.openaiModel,
        messages: [{ role: 'system', content: sys }, { role: 'user', content: JSON.stringify(info) }],
        response_format: { type: 'json_object' },
        temperature: 0.2
      }),
      signal: AbortSignal.timeout(12000)
    });
    if (!res.ok) throw new Error(res.status === 401 ? '401 key rejected' : res.status === 429 ? '429 rate limit/quota' : 'HTTP ' + res.status);
    const data = await res.json();
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    const parsed = JSON.parse(content);
    diag.aiMsg = 'ok';
    return { approve: parsed.approve === true, reason: String(parsed.reason || '').slice(0, 140) };
  } catch (e) {
    diag.aiErr++; diag.aiMsg = e.message;
    return { approve: false, error: true, reason: `OpenAI error (${e.message}); vetoed for safety` };
  } finally {
    councilBusy = false;
  }
}

/* ---------- entries ---------- */
async function openPosition(coin) {
  const addr = coin.address;
  if (state.positions[addr] > 0 || state.cash <= CFG.minCash || isArchived(coin)) return false;
  if (heldAddrs().length >= maxOpenNow()) return false;
  const mode = state.mode, major = isMajorWave(coin);
  const tx = Math.max(1, coin.buysH1 + coin.sellsH1);
  agentSay('announcer', `WHALE_EYE: Validated ${coin.symbol} flow -> ${Math.round(100 * coin.buysH1 / tx)}% buy pressure.`);

  if (state.decision === 'COUNCIL' && (localStorage.getItem('openai_api_key') || '').trim()) {
    const verdict = await askCouncilAI(coin);
    if (!verdict.approve) {
      if (!verdict.skip) {
        agentSay('risk', `RISK_CORE: Vetoed ${coin.symbol}. ${verdict.reason}`);
        bump('boss', 'vetoed');
      }
      return false;
    }
    agentSay('risk', `RISK_CORE: Council AI approved ${coin.symbol}. ${verdict.reason}`);
  }
  // state may have changed while waiting on the AI
  if (state.positions[addr] > 0 || state.cash <= CFG.minCash || heldAddrs().length >= maxOpenNow()) return false;

  const held = heldAddrs();
  if (major && held.filter(a => state.symbols[a] === 'SOL' || state.symbols[a] === 'WSOL').length >= 2) return false;

  const pct = major ? 0.30 : mode === 'LAUNCH' ? CFG.launch.entryPct : mode === 'PUMP' ? CFG.pump.entryPct : CFG.entryPct;
  const liqPct = mode === 'PUMP' ? CFG.pump.maxSpendPctOfLiq : CFG.maxSpendPctOfLiq;
  const minTicket = (mode === 'LAUNCH' || mode === 'PUMP') ? 5 : 10;
  const wanted = Math.max(minTicket, Math.min(state.cash, state.cash * pct));   // no fake "leverage" any more
  const spend = Math.min(wanted, state.cash, coin.liquidity * liqPct);
  if (spend < 1) return false;

  const fee = spend * CFG.feeRate;
  const fill = coin.price * (1 + slippage(spend, coin.liquidity));
  state.cash -= spend;
  state.positions[addr] = (spend - fee) / fill;
  state.costBasis[addr] = fill;
  state.symbols[addr] = coin.symbol;
  state.entryTimes[addr] = Date.now();
  state.peaks[addr] = coin.price;
  state.tiers[addr] = 0;
  state.entryFeat[addr] = featOf(coin);
  state.entryCost[addr] = spend;
  state.tradePnl[addr] = 0;
  state.runnerRecovered[addr] = false;
  bump('trader', 'entries'); bump('macro', 'picks'); bump('boss', 'approved');
  state.fees += fee;
  state.txCount += 1;
  playSfx('buy');
  log(`[EXECUTION] ALPHA_X deployed ${fmtCurrency(spend)} into ${coin.symbol} [${mode}]`);
  logTrade('BUY', `Verified entry on ${coin.symbol} for ${fmtCurrency(spend)}`);
  agentSay('trader', `ALPHA_X: Successfully swapped ${fmtCurrency(spend)} for ${coin.symbol}.`);
  saveState();
  renderAll();
  return true;
}

let entering = false;
async function considerEntry() {
  if (entering || state.cash <= CFG.minCash || councilBusy || heldAddrs().length >= maxOpenNow()) return;
  entering = true;
  try {
    const now = Date.now();
    const cands = Array.from(market.values()).filter(c =>
      isFresh(c) && !(state.positions[c.address] > 0) && !(proposalBlock[c.address] > now) && isBuyable(c) && !isArchived(c)
    ).sort((a, b) => entryScore(b) - entryScore(a));
    if (!cands.length) return;
    const avoid = computeLessons().avoid;
    const allowed = cands.filter(c => !lessonFor(c, avoid)).slice(0, 3);   // best first, not random
    const maxDrift = state.mode === 'PUMP' ? 4 : 2;

    for (const pick of allowed) {
      let c = pick;
      const fresh = await feedJson('quote', `https://api.dexscreener.com/tokens/v1/solana/${pick.address}`);
      if (Array.isArray(fresh)) {
        const m = fresh.find(p => p && p.baseToken && p.baseToken.address === pick.address);
        const f = m && toCoin(m);
        if (f) c = f;
      }
      const drift = (c.price / pick.price - 1) * 100;
      if (drift > maxDrift) {
        proposalBlock[pick.address] = Date.now() + 2 * 60000;
        log(`[LATE] Skipped ${pick.symbol}: price already +${drift.toFixed(1)}% since scan`);
        continue;
      }
      if (!isBuyable(c)) {
        proposalBlock[pick.address] = Date.now() + 2 * 60000;
        log(`[LATE] Skipped ${pick.symbol}: failed entry rules on fresh quote`);
        continue;
      }
      const ok = await openPosition(c);
      if (ok) break;
      proposalBlock[pick.address] = Date.now() + CFG.councilBlockMs;   // was never set before -> AI re-asked every scan
    }
  } finally { entering = false; }
}

/* ---------- exits (per-position mode, pump rules, launch stale rule) ---------- */
function runExits() {
  const now = Date.now();
  for (const addr of heldAddrs()) {
    const coin = market.get(addr);
    const sym = state.symbols[addr] || '?';
    if (!isFresh(coin)) {
      if (!noFeedWarned.has(addr)) { noFeedWarned.add(addr); log(`[WARN] No live price for ${sym}; exits paused until feed returns`); }
      continue;
    }
    noFeedWarned.delete(addr);

    const feat = state.entryFeat[addr] || {};
    const pm = feat.mode || state.mode;           // rules follow the mode the trade was opened in
    const cost = state.costBasis[addr] || coin.price;
    const gain = ((coin.price - cost) / cost) * 100;
    if (!(state.peaks[addr] >= coin.price)) state.peaks[addr] = coin.price;
    const drop = ((state.peaks[addr] - coin.price) / state.peaks[addr]) * 100;
    const healthyDip = classifyDipOrDump(coin) === 'HEALTHY DIP';
    const major = isMajorWave(coin);
    const horizon = determineHoldHorizon(coin);
    const L = CFG.launch, P = CFG.pump;
    const isLaunch = pm === 'LAUNCH' && !major, isPumpPos = pm === 'PUMP' && !major;
    const qty = state.positions[addr] || 0;
    const value = qty * coin.price;
    const profitUsd = (coin.price - cost) * qty;
    const heldMs = now - (state.entryTimes[addr] || now);
    const buyRatio = coin.buysH1 / Math.max(1, coin.buysH1 + coin.sellsH1);
    const stopLimit = major ? CFG.majorStopPct : isPumpPos ? P.stopPct : isLaunch ? L.stopPct : CFG.stopLossPct;

    if (gain <= stopLimit) { closePosition(addr, coin, 'STOP-LOSS CUT', 'RISK_CORE cut'); continue; }

    // flow reversal on a losing pump.fun trade: get out before the stop
    if (isPumpPos && !state.runnerRecovered[addr] && gain < 0 && heldMs > 2 * 60000 && buyRatio < 0.45) {
      closePosition(addr, coin, 'FLOW EXIT', 'Buy flow reversed on'); continue;
    }

    // principal recovery (launch mode uses its own tiers)
    const recoverAt = isPumpPos ? P.recoverPct : 8;
    if (!isLaunch && !state.runnerRecovered[addr] && gain >= recoverAt && value > 0) {
      const initialCost = state.entryCost[addr] || (value / (1 + gain / 100));
      const sellFraction = Math.min(0.85, initialCost / value);
      const qtyToSell = qty * sellFraction;
      if (qtyToSell > 0) {
        const pnl = sellTokens(addr, coin, qtyToSell);
        state.positions[addr] -= qtyToSell;
        state.runnerRecovered[addr] = true;
        playSfx('win');
        log(`[PRINCIPAL RECOVERED] ${sym} | P&L: ${fmtSigned(pnl)}. Remaining bag is a FREE RUNNER`);
        logTrade('PRINCIPAL', `Recovered principal & profit on ${sym}`, pnl);
        agentSay('finance', `KIRKTRON 9001: Principal secured on ${sym}. Free runner active.`);
        saveState();
        continue;
      }
    }

    if (state.runnerRecovered[addr] && drop >= (isPumpPos ? P.trailPct : 12) && !healthyDip) {
      closePosition(addr, coin, 'RUNNER EXIT', 'Free runner trailing stop hit on'); continue;
    }

    if (major) {
      if (profitUsd >= CFG.stableTargetProfitUsd) { closePosition(addr, coin, 'TAKE-PROFIT ($1+)', `Secured $${profitUsd.toFixed(2)} on`); continue; }
    } else if (isPumpPos) {
      if (gain >= P.tier2Pct && state.tiers[addr] < 1) {
        const q = qty * 0.5, pnl = sellTokens(addr, coin, q);
        state.positions[addr] -= q; state.tiers[addr] = 1;
        playSfx('win'); logTrade('TIER 2', `Sold half the runner of ${sym}`, pnl);
        saveState(); continue;
      }
    } else if (isLaunch) {
      if (gain >= L.tier1Pct && state.tiers[addr] < 1) {
        const q = qty * 0.5, pnl = sellTokens(addr, coin, q);
        state.positions[addr] -= q; state.tiers[addr] = 1;
        playSfx('win'); logTrade('TIER 1', `Sold 50% of ${sym}, cost recovered`, pnl);
        saveState(); continue;
      }
      if (gain >= L.tier2Pct && state.tiers[addr] < 2) {
        const q = qty * 0.5, pnl = sellTokens(addr, coin, q);
        state.positions[addr] -= q; state.tiers[addr] = 2;
        playSfx('win'); logTrade('TIER 2', `Sold half the rest of ${sym}`, pnl);
        saveState(); continue;
      }
      if (state.tiers[addr] >= 1 && drop >= L.trailPct && !healthyDip) { closePosition(addr, coin, 'RUNNER EXIT', 'Trailing stop hit on'); continue; }
    } else if (gain >= CFG.takeProfitPct) {
      closePosition(addr, coin, 'TAKE-PROFIT', 'Target secured on'); continue;
    }

    // stale exits
    if (!major && !state.runnerRecovered[addr]) {
      if (isPumpPos && heldMs > P.staleMin * 60000 && gain < P.stalePct) { closePosition(addr, coin, 'STALE EXIT', 'Pump went quiet, closed'); continue; }
      if (isLaunch && state.tiers[addr] < 1 && heldMs > L.staleMs && gain < L.stalePct) { closePosition(addr, coin, 'STALE EXIT', 'Launch went quiet, closed'); continue; }
      if (!isPumpPos && !isLaunch) {
        const maxHold = horizon === 'QUICK SCALP (Minutes)' ? 30 * 60000 : horizon === 'MOMENTUM SURGE (Hours)' ? 6 * HOUR : CFG.staleExitMs;
        if (heldMs > maxHold && gain < 2.0) closePosition(addr, coin, 'STALE EXIT', `Horizon (${horizon}) elapsed, closed`);
      }
    }
  }
}

/* ---------- UI: pump button, protocol, render hook ---------- */
(function () {
  const anchor = $('btn-mode-launch');
  if (anchor && !$('btn-mode-pump')) {
    const b = document.createElement('button');
    b.id = 'btn-mode-pump'; b.className = 'cyber-btn'; b.textContent = '\uD83D\uDC8A PUMP.FUN';
    b.addEventListener('click', () => setTradingMode('PUMP'));
    anchor.parentNode.appendChild(b);
  }
})();

    : box.innerHTML + lines.map(l => `<div class="protocol-line">• ${escapeHtml(l)}</div>`).join('');

/* =====================================================================
   AUDITOR-7
   ===================================================================== */
function auditStats(mode) {
  const rows = state.journal.filter(j => !mode || j.mode === mode);
  const n = rows.length;
  if (!n) return { n: 0 };
  const wins = rows.filter(j => j.win), losses = rows.filter(j => !j.win);
  const sumPnl = a => a.reduce((s, j) => s + j.pnl, 0), avg = a => a.length ? a.reduce((s, j) => s + j.pct, 0) / a.length : 0;
  const gw = sumPnl(wins), gl = Math.abs(sumPnl(losses));
  return {
    n, win: wins.length / n, avg: avg(rows), avgWin: avg(wins), avgLoss: avg(losses),
    pf: gl > 0 ? gw / gl : (gw > 0 ? 99 : 0), net: gw - gl,
    stops: rows.filter(j => j.tag === 'STOP-LOSS CUT').length
  };
}

function runAudit() {
  const out = [];
  const add = (sev, title, detail) => out.push({ sev, title, detail });
  const hasKey = (localStorage.getItem('openai_api_key') || '').trim().length > 5;

  // OpenAI
  if (state.decision === 'COUNCIL' && !hasKey) add('warn', 'Council has no AI key', 'COUNCIL mode is on but no OpenAI key is saved, so every entry is auto-approved. Add a key (KEY) or switch to AUTO.');
  if (diag.aiErr > 0) add(diag.aiErr >= 3 ? 'bad' : 'warn', `OpenAI errors: ${diag.aiErr}`, `Last error: ${diag.aiMsg || 'unknown'}. On error the council now vetoes (fail-safe), so buying pauses until it works. Switch to AUTO to trade without AI.`);
  else if (hasKey && diag.aiMsg === 'ok') add('ok', 'OpenAI reachable', 'Last council call succeeded.');

  // feeds
  if (feedStatus === 'OFFLINE') add('bad', 'Market feed offline', 'Every data request failed. Check connection / rate limits.');
  Object.keys(FEEDS).forEach(n => {
    const f = FEEDS[n];
    if (f.ok === 0 && f.fail >= 3) add('bad', `Feed dead: ${n}`, `${f.fail} failures, last: ${f.msg}.`);
    else if (f.msg === 'rate limited') add('warn', `Feed rate limited: ${n}`, 'Backing off 60s. Consider a longer scan interval.');
  });
  if (diag.hotZero >= 5) add('warn', 'No buyable coins for 5+ scans', 'Filters (incl. anti-chase) may be too strict for current market, or feeds are thin.');
  if (state.mode === 'PUMP') {
    const n = Array.from(market.values()).filter(isPump).length;
    if (n === 0) add('bad', 'No pump.fun tokens in market', 'Check gt-pumpfun / gt-pumpswap feed status (Status tab). The endpoint may be blocked or rate limited.');
    else add('info', `${n} pump.fun tokens tracked`, `${hotCoins().length} currently pass the pump rules.`);
  }

  // risk config
  const rt = 2 * (CFG.feeRate + CFG.baseSlippage) * 100;
  if (Math.abs(CFG.stopLossPct) < rt * 2.5) add('warn', 'Stop-loss tight vs costs', `Stop ${CFG.stopLossPct}% vs ~${rt.toFixed(1)}% round-trip cost. Memecoin noise between 60s scans will trigger it. Consider -5% to -8%.`);
  if (CFG.takeProfitPct / Math.abs(CFG.stopLossPct) < 1.5) add('info', 'Low reward:risk', `Target +${CFG.takeProfitPct}% vs stop ${CFG.stopLossPct}%.`);
  if (CFG.majorLeverage > 1) add('info', 'majorLeverage is ignored', 'v16.7 no longer multiplies SOL/major position size (it put up to 90% of cash in one trade).');
  if (CFG.maxOpenPositions * CFG.entryPct > 1) add('warn', 'Over-allocation possible', 'maxOpenPositions x entryPct exceeds 100% of bankroll.');

  // results
  ['GROWTH', 'SNIPER', 'LAUNCH', 'PUMP'].forEach(m => {
    const s = auditStats(m);
    if (s.n < 8) return;
    const tag = `${m}: ${s.n} trades, ${Math.round(s.win * 100)}% wins, PF ${s.pf.toFixed(2)}`;
    if (s.pf < 1) add(s.n >= 15 ? 'bad' : 'warn', `${m} is losing money`, `${tag}, avg win ${s.avgWin.toFixed(1)}% vs avg loss ${s.avgLoss.toFixed(1)}%.`);
    else add('ok', `${m} profitable`, tag);
    if (s.stops / s.n > 0.5) add('warn', `${m}: over half exit on stop-loss`, 'Entries are late or stops too tight. Check the late-entry finding below.');
  });
  const late = state.journal.filter(j => j.b && (j.b.run === '10-50%' || j.b.run === '50%+') && j.mode !== 'LAUNCH' && j.mode !== 'PUMP');
  const early = state.journal.filter(j => j.b && (j.b.run === 'down' || j.b.run === '0-10%') && j.mode !== 'LAUNCH' && j.mode !== 'PUMP');
  if (late.length >= 6 && early.length >= 6) {
    const a = x => x.reduce((s, j) => s + j.pct, 0) / x.length;
    if (a(late) < a(early) - 1) add('bad', 'Late entries lose more', `Coins already up 10%+ in 1h averaged ${a(late).toFixed(1)}% vs ${a(early).toFixed(1)}% for early entries. Lower maxCh1h / maxCh5m.`);
  }
  if (state.fees > 0 && state.realizedPnl <= 0 && state.realizedPnl + state.fees > 0) add('bad', 'Fees ate the edge', `Gross P&L ${fmtSigned(state.realizedPnl + state.fees)} but fees ${fmtCurrency(state.fees)}. Trade less often / bigger targets.`);

  // exposure
  const p = portfolioValue(), net = state.cash + state.vault + p.value;
  heldAddrs().forEach(a => { if (net > 0 && exitValue(a) / net > 0.4) add('warn', `Concentrated: ${state.symbols[a] || '?'}`, `${Math.round(100 * exitValue(a) / net)}% of net worth in one coin.`); });
  const noPx = heldAddrs().filter(a => !isFresh(market.get(a))).length;
  if (noPx) add('warn', `${noPx} position(s) without live price`, 'Exits are paused for these until the feed returns.');
  if (state.cash <= CFG.minCash) add('info', 'Bankroll is at minimum', 'No new entries until a position closes or you FUND.');
  if (errorBuf.length) add('warn', `${errorBuf.length} script error(s) logged`, 'Latest: ' + errorBuf[errorBuf.length - 1]);

  const rank = { bad: 0, warn: 1, info: 2, ok: 3 };
  out.sort((x, y) => rank[x.sev] - rank[y.sev]);
  auditResult = out;
  out.filter(f => f.sev === 'bad').forEach(f => { if (!auditSeen[f.title]) { auditSeen[f.title] = Date.now(); log('[AUDITOR-7] ' + f.title); } });
}

let auditHeadBuilt = false;
function renderAudit() {
  const head = $('audit-head');
  if (!head) return;
  if (!auditHeadBuilt) {
    head.innerHTML = `<div class="agent-card" style="border-color:#39ff88;cursor:default;margin-bottom:6px;">
      <canvas class="agent-portrait" width="72" height="80" data-robot="auditor" style="border-color:#39ff88;"></canvas>
      <div class="agent-body"><div class="agent-name" style="color:#39ff88;">AUDITOR-7</div><div class="agent-role">System Inspector</div>
      <div class="agent-speech" id="audit-speech"></div></div></div>`;
    auditHeadBuilt = true;
  }
  const bad = auditResult.filter(f => f.sev === 'bad').length, warn = auditResult.filter(f => f.sev === 'warn').length, ok = auditResult.filter(f => f.sev === 'ok').length;
  const sp = $('audit-speech');
  if (sp) sp.textContent = auditResult.length ? `"${bad} critical, ${warn} warnings, ${ok} checks passed."` : '"Run an audit to begin."';
  const col = { bad: 'var(--red)', warn: 'var(--amber)', info: 'var(--cyan)', ok: 'var(--green)' };
  const lbl = { bad: 'CRITICAL', warn: 'WARNING', info: 'INFO', ok: 'OK' };
  const fb = $('audit-findings');
  if (fb) fb.innerHTML = auditResult.length ? auditResult.map(f => `<div class="feed-item" style="border-left-color:${col[f.sev]};">
      <div class="feed-sender" style="color:${col[f.sev]};">${lbl[f.sev]} // ${escapeHtml(f.title)}</div><div class="feed-text">${escapeHtml(f.detail)}</div></div>`).join('')
    : '<div class="empty-note">No findings yet.</div>';
  const ab = $('audit-answer');
  if (ab) {
    const props = (auditAnswer.props || []).map((q, i) => `<div class="feed-item" style="border-left-color:var(--purple);">
      <div class="feed-text"><strong>${escapeHtml(q.key)} = ${escapeHtml(q.value)}</strong> (now ${escapeHtml(CFG[q.key])})<br>${escapeHtml(q.why || '')}</div>
      <button class="cyber-btn accent" data-apply="${i}" style="margin-top:4px;">APPLY</button></div>`).join('');
    ab.innerHTML = (auditAnswer.text ? `<div class="feed-item" style="border-left-color:var(--purple);"><div class="feed-text">${escapeHtml(auditAnswer.text)}</div></div>` : '<div class="empty-note">Tap ASK AI for a review.</div>') + props;
  }
}

function runAuditNow() {
  runAudit();
  try { ROBOT.speak('auditor', 2500); } catch (e) {}
  setText('audit-status', 'Audit complete ' + clock());
  renderAll();
}

function buildReport() {
  const p = portfolioValue(), net = state.cash + state.vault + p.value;
  const L = [`ORBITAL AUDIT ${new Date().toLocaleString()}`, `Mode ${state.mode} / ${state.decision} | Net ${fmtCurrency(net)} | Cash ${fmtCurrency(state.cash)} | Vault ${fmtCurrency(state.vault)} | Realized ${fmtSigned(state.realizedPnl)} | Fees ${fmtCurrency(state.fees)}`, '', 'FINDINGS'];
  auditResult.forEach(f => L.push(`[${f.sev.toUpperCase()}] ${f.title} - ${f.detail}`));
  L.push('', 'RESULTS BY MODE');
  ['GROWTH', 'SNIPER', 'LAUNCH', 'PUMP'].forEach(m => { const s = auditStats(m); if (s.n) L.push(`${m}: ${s.n} trades, ${Math.round(s.win * 100)}% wins, avg ${s.avg.toFixed(1)}%, PF ${s.pf.toFixed(2)}, net ${fmtSigned(s.net)}`); });
  L.push('', 'RECENT TRADES');
  state.trades.slice(0, 15).forEach(t => L.push(`${t.kind} ${t.text}${t.pnl === null ? '' : ' ' + fmtSigned(t.pnl)}`));
  L.push('', 'CONFIG ' + JSON.stringify({ stop: CFG.stopLossPct, tp: CFG.takeProfitPct, entryPct: CFG.entryPct, maxCh5m: CFG.maxCh5m, maxCh1h: CFG.maxCh1h, maxScanRun: CFG.maxScanRun, pump: CFG.pump }));
  return L.join('\n');
}

function copyReport() {
  runAudit();
  const text = buildReport();
  const done = () => { setText('audit-status', 'Report copied to clipboard.'); };
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { setText('audit-status', 'Copy failed.'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

function applyProposal(i) {
  const q = (auditAnswer.props || [])[i];
  if (!q || !TUNABLE[q.key]) return;
  const t = TUNABLE[q.key];
  const v = Math.max(t.min, Math.min(t.max, Number(q.value)));
  if (!isFinite(v)) return;
  state.overrides[q.key] = v; CFG[q.key] = v;
  saveState(); runAudit();
  setText('audit-status', `${q.key} set to ${v}` + (t.reload ? ' (reload the page to apply)' : ''));
  renderAll();
}

function resetOverrides() {
  state.overrides = {};
  Object.keys(TUNABLE).forEach(k => { if (CFG_DEFAULTS[k] !== undefined) CFG[k] = CFG_DEFAULTS[k]; });
  saveState(); runAudit();
  setText('audit-status', 'Rules reset to defaults.');
  renderAll();
}

async function askAuditor() {
  const key = (localStorage.getItem('openai_api_key') || '').trim();
  if (!key) { setText('audit-status', 'Add an OpenAI key first (KEY button).'); return; }
  const r = await openDialog({
    title: 'ASK AUDITOR-7',
    message: 'Ask about the bot logic, losses, or settings. Leave blank for a full review.',
    inputs: [{ id: 'q', label: 'Question', value: '', multiline: true }],
    okText: 'ASK'
  });
  if (!r) return;
  const q = r.values.q.trim() || 'Review the strategy, explain why trades lose money (especially late entries), and propose safe setting changes.';
  runAudit();
  setText('audit-status', 'AUDITOR-7 is thinking...');
  try { ROBOT.speak('auditor', 5000); } catch (e) {}
  try {
    const ctx = {
      mode: state.mode, decision: state.decision,
      cfg: { stop: CFG.stopLossPct, tp: CFG.takeProfitPct, entryPct: CFG.entryPct, maxCh5m: CFG.maxCh5m, maxCh1h: CFG.maxCh1h, maxScanRun: CFG.maxScanRun, minLiquidity: CFG.minLiquidity, minVolumeH1: CFG.minVolumeH1, minBuyRatio: CFG.minBuyRatio, pump: CFG.pump },
      tunable: TUNABLE,
      results: { all: auditStats(null), GROWTH: auditStats('GROWTH'), SNIPER: auditStats('SNIPER'), LAUNCH: auditStats('LAUNCH'), PUMP: auditStats('PUMP') },
      findings: auditResult.map(f => `${f.sev}: ${f.title} - ${f.detail}`),
      journal: state.journal.slice(-20).map(j => ({ s: j.symbol, m: j.mode, pct: +j.pct.toFixed(1), tag: j.tag, b: j.b })),
      errors: errorBuf.slice(-5)
    };
    const sys = 'You are AUDITOR-7, reviewer of a PAPER-TRADING Solana memecoin bot. Be concise (under 180 words) and concrete. Base claims on the data given. Never recommend riskier settings without evidence. Respond ONLY with JSON: {"answer": string, "proposals": [{"key": string, "value": number, "why": string}]}. Max 3 proposals; keys must be from the tunable list.';
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: CFG.openaiModel,
        messages: [{ role: 'system', content: sys }, { role: 'user', content: 'Question: ' + q + '\n\nDATA: ' + JSON.stringify(ctx) }],
        response_format: { type: 'json_object' }, temperature: 0.2
      }),
      signal: AbortSignal.timeout(30000)
    });
    if (!res.ok) throw new Error(res.status === 401 ? '401 key rejected' : res.status === 429 ? '429 rate limit/quota' : 'HTTP ' + res.status);
    const data = await res.json();
    const parsed = JSON.parse(data.choices[0].message.content);
    const props = (Array.isArray(parsed.proposals) ? parsed.proposals : []).filter(x => x && TUNABLE[x.key] && isFinite(Number(x.value))).slice(0, 3)
      .map(x => ({ key: x.key, value: Math.max(TUNABLE[x.key].min, Math.min(TUNABLE[x.key].max, Number(x.value))), why: String(x.why || '').slice(0, 200) }));
    auditAnswer = { text: String(parsed.answer || '').slice(0, 1500), props };
    diag.aiMsg = 'ok';
    setText('audit-status', 'AUDITOR-7 answered ' + clock());
  } catch (e) {
    diag.aiErr++; diag.aiMsg = e.message;
    setText('audit-status', 'AI error: ' + e.message);
  }
  renderAll();
}

(function () {
  const ab = $('audit-answer');
  if (ab) ab.addEventListener('click', e => { const b = e.target.closest('[data-apply]'); if (b) applyProposal(parseInt(b.dataset.apply, 10)); });
})();
