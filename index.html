<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLARIS // HQ - Autonomous Crypto Treasury</title>
  <style>
    :root {
      --bg-color: #050b14;
      --panel-bg: rgba(5, 15, 30, 0.9);
      --border-color: #1e3a8a;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    .panel { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
    .logo { font-size: 16px; font-weight: bold; color: var(--cyan); letter-spacing: 2px; }
    .cyber-btn { background: #111; border: 1px solid var(--border-color); color: var(--cyan); font-size: 10px; padding: 4px 6px; cursor: pointer; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); padding: 8px; }
    .stat-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; }
    .stat-value { font-size: 15px; font-weight: bold; color: var(--cyan); margin-top: 4px; }
    .stat-value.green { color: var(--green); }
    .nav-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .tab-btn { background: #020617; border: 1px solid var(--border-color); color: var(--text-dim); font-size: 10px; padding: 8px 4px; text-align: center; cursor: pointer; text-transform: uppercase; }
    .tab-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(56, 189, 248, 0.1); }
    .tab-pane { display: none; flex-direction: column; gap: 8px; }
    .tab-pane.active { display: flex; }
    .terminal-box { background: #020617; border: 1px solid var(--border-color); padding: 8px; height: 220px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
    .feed-item { padding: 6px; border-left: 2px solid var(--cyan); background: rgba(0, 0, 0, 0.3); }
    .agent-card { background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-color); padding: 10px; margin-bottom: 8px; cursor: pointer; }
    .agent-header { display: flex; align-items: center; gap: 8px; }
    .robot-head { width: 32px; height: 32px; border: 1px solid; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #020617; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-top: 6px; font-size: 8px; background: #020617; padding: 4px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel header">
      <div>
        <div class="logo">SOLARIS // HQ</div>
        <div style="font-size: 9px; color: var(--text-dim);">AUTONOMOUS TREASURY V2</div>
      </div>
      <div>
        <button class="cyber-btn" onclick="resetTreasury()">RESET</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Net Worth</div>
        <div class="stat-value" id="net-worth">$10,000.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Realized P&L</div>
        <div class="stat-value green" id="realized-pnl">+$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Cash Reserve</div>
        <div class="stat-value" style="color: var(--amber);" id="cash-balance">$10,000.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Active Positions</div>
        <div class="stat-value" id="position-count">0</div>
      </div>
    </div>

    <div class="panel" style="padding: 6px 12px; display: flex; justify-content: space-between; font-size: 11px;">
      <span>SOL: <strong id="sol-price" style="color: var(--cyan);">$145.20</strong></span>
      <span>STATUS: <strong style="color: var(--green);">ONLINE</strong></span>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('hub', this)">Hub</button>
      <button class="tab-btn" onclick="switchTab('council', this)">Council</button>
      <button class="tab-btn" onclick="switchTab('warroom', this)">War Room</button>
    </div>

    <div id="tab-hub" class="tab-pane active panel">
      <div style="font-size: 11px; color: var(--cyan); margin-bottom: 4px;">// SYSTEM DIAGNOSTIC LOG</div>
      <div class="terminal-box" id="system-log">
        <div style="color: var(--green);">[00:01] Solaris matrix initialized.</div>
      </div>
    </div>

    <div id="tab-council" class="tab-pane panel">
      <div style="font-size: 11px; color: var(--cyan); margin-bottom: 4px;">// LIVE FEED</div>
      <div class="terminal-box" id="council-feed-container"></div>
    </div>

    <div id="tab-warroom" class="tab-pane panel">
      <div style="font-size: 11px; color: var(--cyan); margin-bottom: 4px;">// WAR ROOM</div>
      <div id="war-room-container"></div>
    </div>
  </div>

  <script>
    const coins = [{ symbol: 'SOL', price: 145.20 }, { symbol: 'BONK', price: 0.000025 }, { symbol: 'RAY', price: 3.46 }];
    const agents = [
      { id: 'fin', name: 'FIN_BOT', role: 'Manager', color: '#38bdf8', icon: '🤖', spent: 0, sold: 0, pnl: 0, min: 0, hr: 0, day: 0, wk: 0 },
      { id: 'risk', name: 'RISK_CORE', role: 'Risk', color: '#f59e0b', icon: '🛡️', spent: 0, sold: 0, pnl: 0, min: 0, hr: 0, day: 0, wk: 0 },
      { id: 'alpha', name: 'ALPHA_X', role: 'Trader', color: '#ef4444', icon: '⚡', spent: 0, sold: 0, pnl: 0, min: 0, hr: 0, day: 0, wk: 0 }
    ];

    let state = { cash: 10000, positions: {}, pnl: 0, feed: [] };

    function switchTab(id, btn) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      btn.classList.add('active');
    }

    function resetTreasury() {
      localStorage.clear();
      location.reload();
    }

    function logMsg(text) {
      const box = document.getElementById('system-log');
      if (!box) return;
      box.innerHTML += `<div>[${new Date().toTimeString().split(' ')[0]}] ${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function render() {
      document.getElementById('net-worth').textContent = '$' + state.cash.toFixed(2);
      document.getElementById('realized-pnl').textContent = (state.pnl >= 0 ? '+' : '') + '$' + state.pnl.toFixed(2);
      document.getElementById('cash-balance').textContent = '$' + state.cash.toFixed(2);
      
      const war = document.getElementById('war-room-container');
      war.innerHTML = agents.map(a => `
        <div class="agent-card" style="border-color: ${a.color};">
          <div class="agent-header">
            <div class="robot-head" style="border-color: ${a.color}; color: ${a.color};">${a.icon}</div>
            <div>
              <strong style="color: ${a.color}; font-size: 11px;">${a.name}</strong>
              <div style="font-size: 9px; color: var(--text-dim);">${a.role}</div>
            </div>
          </div>
          <div class="metrics-grid">
            <div>MIN: $${a.min.toFixed(2)}</div>
            <div>HR: $${a.hr.toFixed(2)}</div>
            <div>DAY: $${a.day.toFixed(2)}</div>
            <div>WK: $${a.wk.toFixed(2)}</div>
          </div>
        </div>
      `).join('');
    }

    function loop() {
      const agent = agents[Math.floor(Math.random() * agents.length)];
      const coin = coins[Math.floor(Math.random() * coins.length)];
      
      if (state.cash > 2000 && Math.random() > 0.4) {
        let amt = 500;
        state.cash -= amt;
        agent.spent += amt;
        logMsg(`${agent.name} bought ${coin.symbol} for $${amt}`);
      } else if (state.cash < 9000) {
        let rev = 550;
        state.cash += rev;
        let pnl = 50;
        state.pnl += pnl;
        agent.pnl += pnl;
        agent.min += pnl;
        logMsg(`${agent.name} sold position [P&L: +$${pnl}]`);
      }
      render();
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
      setInterval(loop, 4000);
    });
  </script>
</body>
</html>
