<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLARIS // HQ - Autonomous Crypto Treasury</title>
  <style>
    :root {
      --bg-color: #050b14;
      --panel-bg: rgba(5, 15, 30, 0.9);
      --border-color: #1e3a8a;
      --cyan: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --purple: #a855f7;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 10px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .logo {
      font-size: 16px;
      font-weight: bold;
      color: var(--cyan);
      letter-spacing: 2px;
    }

    .header-btns {
      display: flex;
      gap: 4px;
    }

    .cyber-btn {
      background: #111;
      border: 1px solid var(--border-color);
      color: var(--cyan);
      font-size: 10px;
      padding: 4px 6px;
      cursor: pointer;
    }
    .cyber-btn.danger { border-color: var(--red); color: var(--red); }
    .cyber-btn.accent { border-color: var(--amber); color: var(--amber); }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      padding: 8px;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 15px;
      font-weight: bold;
      color: var(--cyan);
      margin-top: 4px;
    }
    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .tab-btn {
      background: #020617;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      font-size: 10px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      text-transform: uppercase;
    }

    .tab-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .tab-pane.active {
      display: flex;
    }

    .terminal-box {
      background: #020617;
      border: 1px solid var(--border-color);
      padding: 8px;
      height: 220px;
      overflow-y: auto;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .feed-item {
      padding: 6px;
      border-left: 2px solid var(--cyan);
      background: rgba(0, 0, 0, 0.3);
    }
    .feed-sender {
      font-weight: bold;
      font-size: 10px;
      margin-bottom: 2px;
    }
    .feed-text {
      color: #cbd5e1;
      font-size: 11px;
    }

    .agent-card {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .agent-card:hover {
      background: rgba(56, 189, 248, 0.05);
      border-color: var(--cyan);
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .robot-head {
      width: 32px;
      height: 32px;
      border: 1px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: #020617;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin-top: 6px;
      font-size: 8px;
      background: #020617;
      padding: 4px;
      border: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <div class="panel header">
      <div>
        <div class="logo">SOLARIS // HQ</div>
        <div style="font-size: 9px; color: var(--text-dim);">AUTONOMOUS TREASURY V3</div>
      </div>
      <div class="header-btns">
        <button class="cyber-btn accent" onclick="requestBriefing()">BRIEF</button>
        <button class="cyber-btn" onclick="promptApiKey()">KEY</button>
        <button class="cyber-btn danger" onclick="resetTreasury()">RESET</button>
      </div>
    </div>

    <!-- Main Stats Overview -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Net Worth</div>
        <div class="stat-value" id="net-worth">$10,000.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Realized P&L</div>
        <div class="stat-value green" id="realized-pnl">+$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Cash Reserve</div>
        <div class="stat-value" style="color: var(--amber);" id="cash-balance">$10,000.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Active Positions</div>
        <div class="stat-value" id="position-count">0</div>
      </div>
    </div>

    <!-- Market Quick Ticker -->
    <div class="panel" style="padding: 6px 12px; display: flex; justify-content: space-between; font-size: 11px;">
      <span>SOL: <strong id="sol-price" style="color: var(--cyan);">$145.20</strong></span>
      <span>NEWS: <strong style="color: var(--green);">LIVE FEED</strong></span>
      <span>MODE: <strong style="color: var(--amber);">ACTIVE</strong></span>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('hub', this)">Hub</button>
      <button class="tab-btn" onclick="switchTab('council', this)">Council</button>
      <button class="tab-btn" onclick="switchTab('warroom', this)">War Room</button>
    </div>

    <!-- TAB 1: HUB -->
    <div id="tab-hub" class="tab-pane active panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <div style="font-size: 11px; color: var(--cyan);">// SYSTEM DIAGNOSTIC LOG</div>
        <button class="cyber-btn" style="font-size: 9px;" onclick="requestBriefing()">SUMMARY</button>
      </div>
      <div class="terminal-box" id="system-log">
        <div style="color: var(--green);">[00:01] Treasury matrix initialized.</div>
      </div>
    </div>

    <!-- TAB 2: COUNCIL FEED -->
    <div id="tab-council" class="tab-pane panel">
      <div style="font-size: 11px; color: var(--cyan); margin-bottom: 4px;">// LIVE AGENT DEBATE & NEWS FEED</div>
      <div class="terminal-box" style="height: 260px;" id="council-feed-container"></div>
    </div>

    <!-- TAB 3: WAR ROOM -->
    <div id="tab-warroom" class="tab-pane panel">
      <div style="font-size: 11px; color: var(--cyan); margin-bottom: 4px;">// WAR ROOM (CLICK AGENT FOR INTEL)</div>
      <div id="war-room-container" style="max-height: 260px; overflow-y: auto;"></div>
    </div>
  </div>

  <script>
    const marketCoins = [
      { symbol: 'SOL', price: 145.20 },
      { symbol: 'BONK', price: 0.000025 },
      { symbol: 'JTO', price: 1.84 },
      { symbol: 'RAY', price: 3.46 },
      { symbol: 'WIF', price: 1.32 }
    ];

    const agentDefs = [
      { id: 'finance', name: 'FIN_BOT v2', role: 'Portfolio Manager', risk: 'Low', color: '#38bdf8', icon: '🤖', totalSpent: 0, totalSold: 0, pnl: 0, minPnl: 0, hrPnl: 0, dayPnl: 0, wkPnl: 0 },
      { id: 'risk', name: 'RISK_CORE', role: 'Exposure Control', risk: 'Med', color: '#f59e0b', icon: '🛡️', totalSpent: 0, totalSold: 0, pnl: 0, minPnl: 0, hrPnl: 0, dayPnl: 0, wkPnl: 0 },
      { id: 'trader', name: 'ALPHA_X', role: 'Execution Matrix', risk: 'High', color: '#ef4444', icon: '⚡', totalSpent: 0, totalSold: 0, pnl: 0, minPnl: 0, hrPnl: 0, dayPnl: 0, wkPnl: 0 },
      { id: 'advisor', name: 'MACRO_9', role: 'Strategy Planner', risk: 'Low', color: '#a855f7', icon: '🌐', totalSpent: 0, totalSold: 0, pnl: 0, minPnl: 0, hrPnl: 0, dayPnl: 0, wkPnl: 0 },
      { id: 'cfo', name: 'CFO_UNIT', role: 'Capital Authority', risk: 'Low', color: '#22c55e', icon: '🏛️', totalSpent: 0, totalSold: 0, pnl: 0, minPnl: 0, hrPnl: 0, dayPnl: 0, wkPnl: 0 }
    ];

    let state = {
      cash: 10000,
      positions: { SOL: 0, BONK: 0, JTO: 0, RAY: 0, WIF: 0 },
      avgBuyPrice: { SOL: 0, BONK: 0, JTO: 0, RAY: 0, WIF: 0 },
      realizedPnl: 0,
      councilFeed: [],
      agentState: {}
    };

    const cryptoNewsHeadlines = [
      "BREAKING: Solana ecosystem TVL surges past multi-month highs on heavy volume.",
      "MACRO ALERT: Federal Reserve signals stable rates, triggering altcoin speculation.",
      "DEX LIQUIDITY SWEEP: Massive order book imbalances detected across SOL pairs.",
      "WHALE ACTIVITY: Over $50M in stablecoins moved to exchange treasuries."
    ];

    const bigMoneyBanter = [
      "Deploying cash reserves into this breakout.",
      "Risk Core is active, heavy-loading positions right now.",
      "Massive liquidity sweep. Locking in gains.",
      "Reacting to the latest news feed—scaling high-conviction assets."
    ];

    function fmtCurrency(val) {
      if (Math.abs(val) < 0.001) return '$' + val.toFixed(6);
      return '$' + val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    function resetTreasury() {
      if (confirm("Reset treasury back to $10,000?")) {
        localStorage.clear();
        location.reload();
      }
    }

    function promptApiKey() {
      const key = prompt("Enter your Gemini API key (stored in browser localStorage):", localStorage.getItem('gemini_api_key') || '');
      if (key !== null) {
        localStorage.setItem('gemini_api_key', key.trim());
        alert("API Key saved successfully!");
      }
    }

    function getNetWorth() {
      let total = state.cash;
      marketCoins.forEach(coin => {
        total += (state.positions[coin.symbol] || 0) * coin.price;
      });
      return total;
    }

    function addSystemLog(msg) {
      const logBox = document.getElementById('system-log');
      if (!logBox) return;
      const timeStr = new Date().toTimeString().split(' ')[0];
      logBox.innerHTML += `<div>[${timeStr}] ${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function requestBriefing() {
      const briefingText = `EXECUTIVE BRIEFING: Net Worth is ${fmtCurrency(getNetWorth())}. Realized P&L: ${fmtCurrency(state.realizedPnl)}. Cash Reserve: ${fmtCurrency(state.cash)}.`;
      const cfo = agentDefs.find(a => a.id === 'cfo') || agentDefs[0];
      state.councilFeed.unshift({ sender: cfo.name + ' [BRIEFING]', text: briefingText, color: '#22c55e', time: new Date().toLocaleTimeString() });
      renderCouncilFeed();
      switchTab('council', document.querySelectorAll('.tab-btn')[1]);
    }

    function inspectAgent(agentId) {
      const agent = agentDefs.find(a => a.id === agentId);
      if (!agent) return;
      alert(`AGENT INTEL: ${agent.name} (${agent.role})\n- Lifetime P&L: ${fmtCurrency(agent.pnl)}\n- Total Deployed: ${fmtCurrency(agent.totalSpent)}\n- Per Min P&L: ${fmtCurrency(agent.minPnl)}\n- Per Hour P&L: ${fmtCurrency(agent.hrPnl)}\n- Per Day P&L: ${fmtCurrency(agent.dayPnl)}\n- Per Week P&L: ${fmtCurrency(agent.wkPnl)}`);
    }

    function renderCouncilFeed() {
      const container = document.getElementById('council-feed-container');
      if (!container) return;
      container.innerHTML = state.councilFeed.map(item => `
        <div class="feed-item" style="border-left-color: ${item.color};">
          <div class="feed-sender" style="color: ${item.color};">${item.sender} <span style="font-weight: normal; color: #64748b; font-size: 9px;">${item.time || ''}</span></div>
          <div class="feed-text">"${item.text}"</div>
        </div>
      `).join('');
    }

    function renderWarRoom() {
      const container = document.getElementById('war-room-container');
      if (!container) return;
      container.innerHTML = agentDefs.map(agent => {
        const lastAction = state.agentState[agent.id] || { action: 'HOLD', speech: 'Monitoring feeds.' };
        return `
          <div class="agent-card" style="border-color: ${agent.color};" onclick="inspectAgent('${agent.id}')">
            <div class="agent-header">
              <div class="robot-head" style="border-color: ${agent.color}; color: ${agent.color};">${agent.icon}</div>
              <div style="flex-grow: 1;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <strong style="color: ${agent.color}; font-size: 11px;">${agent.name}</strong>
                  <span style="font-size: 8px; background: #111; padding: 2px 4px; border: 1px solid ${agent.color}; color: #fff;">${(lastAction.action || 'HOLD').toUpperCase()}</span>
                </div>
                <div style="font-size: 9px; color: var(--text-dim);">${agent.role} | Risk: ${agent.risk}</div>
              </div>
            </div>
            <div style="margin-top: 4px; font-size: 10px; font-style: italic; color: #cbd5e1;">"${lastAction.speech}"</div>
            <div class="metrics-grid">
              <div>MIN: <span style="color: ${agent.minPnl >= 0 ? 'var(--green)' : 'var(--red)}">${fmtCurrency(agent.minPnl)}</span></div>
              <div>HR: <span style="color: ${agent.hrPnl >= 0 ? 'var(--green)' : 'var(--red)}">${fmtCurrency(agent.hrPnl)}</span></div>
              <div>DAY: <span style="color: ${agent.dayPnl >= 0 ? 'var(--green)' : 'var(--red)}">${fmtCurrency(agent.dayPnl)}</span></div>
              <div>WK: <span style="color: ${agent.wkPnl >= 0 ? 'var(--green)' : 'var(--red)}">${fmtCurrency(agent.wkPnl)}</span></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function processMarketLoop() {
      marketCoins.forEach(coin => {
        const fluctuation = (Math.random() - 0.48) * 0.05;
        coin.price = Math.max(0.000001, coin.price * (1 + fluctuation));
      });

      if (Math.random() < 0.25) {
        const news = cryptoNewsHeadlines[Math.floor(Math.random() * cryptoNewsHeadlines.length)];
        state.councilFeed.unshift({ sender: 'NEWSWIRE // FEED', text: news, color: '#38bdf8', time: new Date().toLocaleTimeString() });
      }

      const agent = agentDefs[Math.floor(Math.random() * agentDefs.length)];
      const coin = marketCoins[Math.floor(Math.random() * marketCoins.length)];
      const action = Math.random() > 0.35 ? 'buy' : 'sell';
      const speech = bigMoneyBanter[Math.floor(Math.random() * bigMoneyBanter.length)];

      if (action === 'buy' && state.cash > 1000) {
        const allocation = state.cash * 0.25;
        state.cash -= allocation;
        agent.totalSpent += allocation;
        const qtyPurchased = allocation / coin.price;
        state.positions[coin.symbol] = (state.positions[coin.symbol] || 0) + qtyPurchased;
        addSystemLog(`[TRADE] ${agent.name} BOUGHT $${allocation.toFixed(2)} of ${coin.symbol}`);
      } else {
        const currentQty = state.positions[coin.symbol] || 0;
        if (currentQty > 0.01) {
          const sellQty = currentQty * 0.5;
          const revenue = sellQty * coin.price;
          const tradePnl = revenue * 0.1;

          state.cash += revenue;
          state.positions[coin.symbol] -= sellQty;
          state.realizedPnl += tradePnl;
          
          agent.pnl += tradePnl;
          agent.minPnl += tradePnl;
          agent.hrPnl += tradePnl;
          agent.dayPnl += tradePnl;
          agent.wkPnl += tradePnl;

          addSystemLog(`[TRADE] ${agent.name} SOLD ${coin.symbol} [P&L: ${fmtCurrency(tradePnl)}]`);
        }
      }

      state.agentState[agent.id] = { action, speech };
      state.councilFeed.unshift({ sender: agent.name, text: speech, color: agent.color, time: new Date().toLocaleTimeString() });
      state.councilFeed = state.councilFeed.slice(0, 25);

      updateStats();
      renderCouncilFeed();
      renderWarRoom();
    }

    function updateStats() {
      const sol = marketCoins.find(c => c.symbol === 'SOL');
      if (document.getElementById('sol-price')) document.getElementById('sol-price').textContent = fmtCurrency(sol.price);
      if (document.getElementById('net-worth')) document.getElementById('net-worth').textContent = fmtCurrency(getNetWorth());
      if (document.getElementById('cash-balance')) document.getElementById('cash-balance').textContent = fmtCurrency(state.cash);
      
      const pnlEl = document.getElementById('realized-pnl');
      if (pnlEl) {
        pnlEl.textContent = `${state.realizedPnl >= 0 ? '+' : '-'}${fmtCurrency(Math.abs(state.realizedPnl))}`;
        pnlEl.className = `stat-value ${state.realizedPnl >= 0 ? 'green' : 'red'}`;
      }
      if (document.getElementById('position-count')) {
        document.getElementById('position-count').textContent = Object.values(state.positions).filter(v => v > 0.01).length;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderCouncilFeed();
      renderWarRoom();
      setInterval(processMarketLoop, 4000);
    });
  </script>
</body>
</html>
