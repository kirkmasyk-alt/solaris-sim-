<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORBITAL // HQ - Autonomous Crypto Treasury</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0a0118;
      --panel-bg: #150a30;
      --outline: #05000f;
      --border-color: #ff2bd6;
      --cyan: #00f0ff;
      --green: #39ff88;
      --red: #ff3b5c;
      --amber: #f9f871;
      --purple: #b45cff;
      --text-main: #e9f7ff;
      --text-dim: #8a7fb8;
      --pixel: 'Press Start 2P', 'Courier New', monospace;
      --body: 'VT323', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      font-family: var(--body);
      -webkit-font-smoothing: none;
    }

    body {
      background-color: var(--bg-color);
      background-image:
        linear-gradient(rgba(0,240,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,43,214,0.06) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px;
      color: var(--text-main);
      font-size: 18px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, transparent 1px, transparent 3px);
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: var(--panel-bg);
      border: 4px solid var(--outline);
      box-shadow: inset 2px 2px 0 #3a1d78, inset -2px -2px 0 #0d0422, 4px 4px 0 var(--outline);
      padding: 16px;
    }

    .header-panel {
      border-color: var(--border-color);
      text-align: center;
    }

    .header-title {
      font-family: var(--pixel);
      font-size: 14px;
      color: var(--cyan);
      text-shadow: 2px 2px 0 var(--outline);
      margin-bottom: 6px;
    }

    .header-subtitle {
      font-size: 16px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .row-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      gap: 6px;
    }

    .row-label { 
      font-size: 18px; 
      color: var(--text-dim); 
    }

    .row-value {
      font-family: var(--pixel);
      font-size: 12px;
      color: var(--amber);
    }

    .row-value.green { color: var(--green); }
    .row-value.red { color: var(--red); }

    .terminal-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .terminal-title {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--purple);
    }

    .terminal-screen {
      background: #05000f;
      border: 2px solid #251254;
      padding: 10px;
      height: 150px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--green);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .terminal-screen::-webkit-scrollbar {
      width: 6px;
    }
    .terminal-screen::-webkit-scrollbar-thumb {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
    }

    .btn-panel {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      background: #251254;
      border: 3px solid var(--outline);
      color: var(--text-main);
      font-family: var(--pixel);
      font-size: 11px;
      padding: 12px 0;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--outline);
      image-rendering: pixelated;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--outline);
    }

    button#start-btn { border-color: var(--green); color: var(--green); }
    button#stop-btn { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <div class="panel header-panel">
      <div class="header-title">ORBITAL // HQ</div>
      <div class="header-subtitle">Autonomous Crypto Treasury AI</div>
    </div>

    <!-- METRICS PANEL -->
    <div class="panel">
      <div class="row-panel">
        <span class="row-label">TRAINING CYCLE (EPISODE):</span>
        <span id="cycle-val" class="row-value">0</span>
      </div>
      <div class="row-panel">
        <span class="row-label">CURRENT PRICE STATE:</span>
        <span id="state-val" class="row-value">CRASHING</span>
      </div>
      <div class="row-panel">
        <span class="row-label">LAST AI ACTION:</span>
        <span id="action-val" class="row-value">HOLD</span>
      </div>
      <div class="row-panel">
        <span class="row-label">WIN / LOSS REWARD:</span>
        <span id="reward-val" class="row-value">0</span>
      </div>
      <div class="row-panel">
        <span class="row-label">TOTAL TREASURY VALUE:</span>
        <span id="balance-val" class="row-value green">$1,000.00</span>
      </div>
    </div>

    <!-- AI TERMINAL LOGS -->
    <div class="panel terminal-panel">
      <div class="terminal-title">>_ LEARNING_ENGINE_OUTPUT</div>
      <div id="terminal" class="terminal-screen">
        <div>[SYSTEM] AI initialized. Press START RUN to begin optimization loop...</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="btn-panel">
      <button id="start-btn" onclick="startTraining()">START RUN</button>
      <button id="stop-btn" onclick="stopTraining()">HALT</button>
    </div>

  </div>

  <!-- REINFORCEMENT LEARNING ENGINE -->
  <script>
    // 1. ENVIRONMENT CONFIGURATION
    // The markets have 3 basic states
    const STATES = ["CRASHING", "STABLE", "MOONING"];
    // The AI has 2 options it can choose from in each state
    const ACTIONS = ["BUY", "SELL"]; 

    // 2. THE AI BRAIN (Q-Table look-up matrix)
    // Stores expectations of rewards for [State][Action]
    // Row 0 (Crashing): [BUY, SELL]
    // Row 1 (Stable):   [BUY, SELL]
    // Row 2 (Mooning):  [BUY, SELL]
    let qTable = {
      "CRASHING": { "BUY": 0, "SELL": 0 },
      "STABLE":   { "BUY": 0, "SELL": 0 },
      "MOONING":  { "BUY": 0, "SELL": 0 }
    };

    // Hyperparameters for loss processing and optimization
    const learningRate = 0.2; // How fast it replaces old knowledge with new data
    const discountFactor = 0.8; // How much it cares about long-term vs instant rewards
    let explorationRate = 0.6; // Early high randomness to discover strategies (Exploration)

    // Simulation metrics
    let treasuryBalance = 1000.00;
    let currentCycle = 0;
    let trainingInterval = null;
    let currentState = "STABLE";

    const terminalEl = document.getElementById("terminal");

    function logToTerminal(text) {
      const line = document.createElement("div");
      line.innerText = text;
      terminalEl.appendChild(line);
      terminalEl.scrollTop = terminalEl.scrollHeight;
    }

    // 3. THE REINFORCEMENT LEARNING SIMULATION LOOP
    function executeTrainingStep() {
      currentCycle++;
      document.getElementById("cycle-val").innerText = currentCycle;

      // Randomly change environment's status to simulate an unpredictable market
      currentState = STATES[Math.floor(Math.random() * STATES.length)];
      document.getElementById("state-val").innerText = currentState;

      // A. EXPLORATION VS EXPLOITATION CHOICE
      let chosenAction = "";
      if (Math.random() < explorationRate) {
        // Explore: Pick a completely random choice to see what happens
        chosenAction = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
      } else {
        // Exploit: Look at the Q-table matrix and pick the highest scored action
        let buyValue = qTable[currentState]["BUY"];
        let sellValue = qTable[currentState]["SELL"];
        chosenAction = buyValue >= sellValue ? "BUY" : "SELL";
      }
      
      document.getElementById("action-val").innerText = chosenAction;

      // B. ENVIROMENT REWARD MATRIX (Determining Wins vs Losses)
      let reward = 0;
      if (currentState === "CRASHING") {
        reward = (chosenAction === "SELL") ? 100 : -100; // Win if it shorts/sells a crash, Loss if it buys into it
      } else if (currentState === "MOONING") {
        reward = (chosenAction === "BUY") ? 100 : -100;  // Win if it buys the pump, Loss if it misses out by selling
      } else {
        reward = (chosenAction === "SELL") ? 10 : -10;   // Minimal shifts during stagnant conditions
      }

      // Track treasury value based on performance
      treasuryBalance += (reward * 0.15);
      const balanceEl = document.getElementById("balance-val");
      balanceEl.innerText = `$${treasuryBalance.toFixed(2)}`;
      balanceEl.className = treasuryBalance >= 1000 ? "row-value green" : "row-value red";

      const rewardEl = document.getElementById("reward-val");
      rewardEl.innerText = reward > 0 ? `+${reward} (WIN)` : `${reward} (LOSS)`;
      rewardEl.className = reward > 0 ? "row-value green" : "row-value red";

      // C. THE CORE OPTIMIZATION: UPDATE Q-TABLE VALUES (Bellman Equation)
      // Look ahead to see what the next hypothetical best value is
      let nextState = STATES[Math.floor(Math.random() * STATES.length)];
      let maxFutureReward = Math.max(qTable[nextState]["BUY"], qTable[nextState]["SELL"]);
      
      // Calculate the difference between prediction and reality (Temporal Difference Loss)
      let oldQValue = qTable[currentState][chosenAction];
