<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLARIS // Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050811; --panel: #0d1527; --line: #1e3a5f; --cyan: #38bdf8;
      --green: #22c55e; --red: #ef4444; --gold: #f59e0b; --text: #f8fafc; --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 12px; }
    .app { max-width: 900px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 2px solid var(--cyan); background: var(--panel); margin-bottom: 12px; }
    .brand { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--cyan); }
    .btn { background: rgba(56,189,248,0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px; font-family: 'Press Start 2P', monospace; font-size: 6px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .box { border: 1px solid var(--line); background: var(--panel); padding: 10px; }
    .label { font-family: 'Press Start 2P', monospace; font-size: 6px; color: var(--muted); margin-bottom: 6px; }
    .val { font-size: 1.2rem; font-weight: 800; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .tab { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px; font-family: 'Press Start 2P', monospace; font-size: 6px; cursor: pointer; text-align: center; }
    .tab.active { border-color: var(--cyan); color: var(--cyan); background: rgba(56,189,248,0.1); }
    .view { display: none; }
    .view.active { display: block; }
    .chat-box { border: 1px solid var(--line); background: #04070d; height: 320px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .bubble { background: rgba(13,21,39,0.9); border-left: 3px solid var(--cyan); padding: 8px; font-size: 0.8rem; }
    .sender { font-family: 'Press Start 2P', monospace; font-size: 6px; color: var(--cyan); margin-bottom: 4px; }
    .modal { position: fixed; inset: 0; background: rgba(5,8,17,0.9); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal.open { display: flex; }
    .modal-content { background: var(--panel); border: 2px solid var(--cyan); padding: 16px; width: 100%; max-width: 400px; }
    input { width: 100%; background: #04070d; border: 1px solid var(--line); color: #fff; padding: 8px; margin: 10px 0; font-family: monospace; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">SOLARIS // HQ</div>
      <div>
        <span id="api-status" style="font-family:'Press Start 2P',monospace; font-size:6px; color:var(--gold); margin-right:8px;">LOCAL</span>
        <button class="btn" onclick="openKeyModal()">⚙️ KEY</button>
      </div>
    </header>

    <div class="grid">
      <div class="box">
        <div class="label">Net Worth</div>
        <div class="val" id="net-worth" style="color:var(--cyan);">$10,000.00</div>
      </div>
      <div class="box">
        <div class="label">Cash Reserve</div>
        <div class="val" id="cash-balance" style="color:var(--gold);">$10,000.00</div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('hub', this)">Hub</div>
      <div class="tab" onclick="switchTab('council', this)">Council Table</div>
      <div class="tab" onclick="switchTab('agents', this)">Agents</div>
    </div>

    <div class="view active" id="view-hub">
      <div class="box" style="margin-bottom:10px;">
        <div class="label">Market Status</div>
        <div>SOL: <span id="sol-price">$145.20</span> | Sentiment: Bullish</div>
      </div>
      <div class="box" id="terminal" style="font-family:'Press Start 2P',monospace; font-size:6px; height:180px; overflow-y:auto; color:var(--green);">
        [00:01] Solaris neural net initialized.<br>
      </div>
    </div>

    <div class="view" id="view-council">
      <div class="label" style="margin-bottom:6px;">// TABLE DEBATE FEED</div>
      <div class="chat-box" id="council-feed">
        <div class="bubble"><div class="sender">SYSTEM</div>Agents seated at the table. Ready for live session.</div>
      </div>
    </div>

    <div class="view" id="view-agents">
      <div id="agent-list" style="display:grid; gap:8px;"></div>
    </div>
  </div>

  <div class="modal" id="key-modal">
    <div class="modal-content">
      <div class="label">Gemini API Key</div>
      <input type="password" id="api-input" placeholder="AIzaSy..." />
      <div style="display:flex; justify-content:flex-end; gap:6px;">
        <button class="btn" onclick="closeKeyModal()">Cancel</button>
        <button class="btn" style="border-color:var(--green); color:var(--green);" onclick="saveKey()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let agents = [
      { name: 'FIN_BOT', role: 'Portfolio Manager', pnl: 0, wins: 0, losses: 0, color: '#38bdf8' },
      { name: 'RISK_CORE', role: 'Risk Control', pnl: 0, wins: 0, losses: 0, color: '#f59e0b' },
      { name: 'ALPHA_X', role: 'Execution Matrix', pnl: 0, wins: 0, losses: 0, color: '#ef4444' }
    ];
    let state = { cash: 10000, solPrice: 145.20, feed: [] };

    function switchTab(name, el) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      el.classList.add('active');
    }

    function openKeyModal() { document.getElementById('key-modal').classList.add('open'); document.getElementById('api-input').value = localStorage.getItem('gemini_key') || ''; }
    function closeKeyModal() { document.getElementById('key-modal').classList.remove('open'); }
    function saveKey() {
      const k = document.getElementById('api-input').value.trim();
      if(k) localStorage.setItem('gemini_key', k); else localStorage.removeItem('gemini_key');
      checkKey(); closeKeyModal();
    }
    function checkKey() {
      const has = !!localStorage.getItem('gemini_key');
      const st = document.getElementById('api-status');
      st.textContent = has ? 'AI LIVE' : 'LOCAL';
      st.style.color = has ? 'var(--green)' : 'var(--gold)';
    }

    function renderAgents() {
      document.getElementById('agent-list').innerHTML = agents.map(a => `
        <div class="box" style="border-left: 3px solid ${a.color};">
          <div class="sender" style="color:${a.color};">${a.name} // ${a.role}</div>
          <div style="font-size:0.75rem; color:var(--muted); margin-top:4px;">Wins: ${a.wins} | Losses: ${a.losses} | P&amp;L: $${a.pnl.toFixed(2)}</div>
        </div>
      `).join('');
    }

    async function runLoop() {
      state.solPrice *= (1 + (Math.random() - 0.48) * 0.02);
      document.getElementById('sol-price').textContent = `$${state.solPrice.toFixed(2)}`;

      const agent = agents[Math.floor(Math.random() * agents.length)];
      const text = `Let's discuss our exposure on SOL at $${state.solPrice.toFixed(2)}. Market vectors look unstable.`;
      
      state.feed.unshift({ sender: agent.name, text: text, color: agent.color });
      if(state.feed.length > 15) state.feed.pop();

      document.getElementById('council-feed').innerHTML = state.feed.map(f => `
        <div class="bubble" style="border-left-color:${f.color};">
          <div class="sender" style="color:${f.color};">${f.sender}</div>
          <div>"${f.text}"</div>
        </div>
      `).join('');

      renderAgents();
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkKey();
      renderAgents();
      setInterval(runLoop, 6000);
    });
  </script>
</body>
</html>
