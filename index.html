<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORBITAL // HQ - Autonomous Crypto Treasury</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0a0118;
      --panel-bg: #150a30;
      --outline: #05000f;
      --border-color: #ff2bd6;
      --cyan: #00f0ff;
      --green: #39ff88;
      --red: #ff3b5c;
      --amber: #f9f871;
      --purple: #b45cff;
      --text-main: #e9f7ff;
      --text-dim: #8a7fb8;
      --pixel: 'Press Start 2P', 'Courier New', monospace;
      --body: 'VT323', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: var(--body);
      -webkit-font-smoothing: none;
    }

    body {
      background-color: var(--bg-color);
      background-image:
        linear-gradient(rgba(0,240,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,43,214,0.06) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px;
      color: var(--text-main);
      font-size: 16px;
      padding: 10px 14px 14px 10px;
      display: flex;
      justify-content: center;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, transparent 1px, transparent 3px);
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: var(--panel-bg);
      border: 4px solid var(--outline);
      box-shadow: inset 2px 2px 0 #3a1d78, inset -2px -2px 0 #0d0422, 4px 4px 0 var(--outline);
      padding: 12px;
    }

    .header-panel {
      border-color: var(--border-color);
      text-align: center;
    }

    .header-title {
      font-family: var(--pixel);
      font-size: 12px;
      color: var(--cyan);
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--text-main);
    }

    .row-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      gap: 6px;
    }
    .row-label { font-size: 15px; color: var(--text-dim); text-transform: uppercase; }
    .row-value { font-family: var(--pixel); font-size: 11px; color: var(--amber); }
    .row-value.green { color: var(--green); }
    .row-value.red { color: var(--red); }

    .terminal-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .terminal-title {
      font-size: 13px;
      color: var(--text-dim);
      padding-left: 4px;
    }

    .terminal-screen {
      background: #05000f;
      border: 2px solid #251254;
      padding: 10px;
      height: 150px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--green);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-panel {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      background: #251254;
      border: 3px solid var(--outline);
      color: var(--text-main);
      font-family: var(--pixel);
      font-size: 10px;
      padding: 12px 0;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--outline);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--outline);
    }

    button#start-btn { border-color: var(--green); color: var(--green); }
    button#stop-btn { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <div class="panel header-panel">
      <div class="header-title">ORBITAL // HQ</div>
      <div class="header-subtitle">AUTONOMOUS CRYPTO TREASURY AI</div>
    </div>

    <!-- METRICS ROW PANEL -->
    <div class="panel">
      <div class="row-panel">
        <span class="row-label">TRAINING CYCLE (EPISODE):</span>
        <span id="cycle-val" class="row-value">0</span>
      </div>
      <div class="row-panel">
        <span class="row-label">CURRENT PRICE STATE:</span>
        <span id="state-val" class="row-value">NORMAL_UP</span>
      </div>
      <div class="row-panel">
        <span class="row-label">LAST AI ACTION:</span>
        <span id="action-val" class="row-value">HOLD</span>
      </div>
      <div class="row-panel">
        <span class="row-label">WIN / LOSS REWARD:</span>
        <span id="reward-val" class="row-value">0</span>
      </div>
      <div class="row-panel">
        <span class="row-label">TOTAL TREASURY VALUE:</span>
        <span id="balance-val" class="row-value green">$1,000.00</span>
      </div>
    </div>

    <!-- AI TERMINAL LOGS -->
    <div class="panel terminal-panel">
      <div class="terminal-title">> LEARNING ENGINE OUTPUT</div>
      <div id="terminal" class="terminal-screen">
        <div>[SYSTEM] AI initialized. Press START RUN to begin optimization loop...</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="btn-panel">
      <button id="start-btn" onclick="startTraining()">START RUN</button>
      <button id="stop-btn" onclick="stopTraining()">HALT</button>
    </div>

  </div>

  <!-- COMPACT ADVANCED INTELLIGENCE ENGINE -->
  <script>
    // Asset options to log variety in tracking updates
    const TOKENS = ["UZICAT", "CYBERINU", "QOMPUTE", "FRANK", "QT", "LLM"];
    
    // Multi-tier drawdown bands preventing instant stop-loss cuts
    const STATES = ["NORMAL_UP", "MINOR_DRAWDOWN", "CRITICAL_ZONE", "FREE_FALL"];
    const ACTIONS = ["HOLD", "STOP_LOSS_CUT"];

    // The optimization memory matrix
    let qTable = {
      "NORMAL_UP":       { "HOLD": 10,  "STOP_LOSS_CUT": -50 },
      "MINOR_DRAWDOWN":  { "HOLD": 5,   "STOP_LOSS_CUT": -20 },
      "CRITICAL_ZONE":   { "HOLD": -5,  "STOP_LOSS_CUT": -5  },
      "FREE_FALL":       { "HOLD": -80, "STOP_LOSS_CUT": 30  }
    };

    let learningRate = 0.25;
    let discountFactor = 0.80;
    let explorationRate = 0.40;

    let treasuryBalance = 1000.00;
    let currentCycle = 0;
    let trainingInterval = null;

    const terminalEl = document.getElementById("terminal");

    function logToTerminal(text) {
      const line = document.createElement("div");
      line.innerText = text;
      terminalEl.appendChild(line);
      terminalEl.scrollTop = terminalEl.scrollHeight;
    }

    function executeTrainingStep() {
      currentCycle++;
      document.getElementById("cycle-val").innerText = currentCycle;

      // Cycle environment between localized risk exposure steps
      const currentState = STATES[Math.floor(Math.random() * STATES.length)];
      const targetToken = TOKENS[Math.floor(Math.random() * TOKENS.length)];
      document.getElementById("state-val").innerText = currentState;

      // Policy decision calculations
      let chosenAction = "";
      if (Math.random() < explorationRate) {
        chosenAction = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
      } else {
        chosenAction = qTable[currentState]["HOLD"] >= qTable[currentState]["STOP_LOSS_CUT"] ? "HOLD" : "STOP_LOSS_CUT";
      }
      document.getElementById("action-val").innerText = chosenAction;

      const isRecovery = Math.random() > 0.45; // Simulated market reaction
      let reward = 0;
      let balanceChange = 0;

      // Handle win/loss mechanics inside critical drawdown ranges
      if (currentState === "CRITICAL_ZONE") {
        if (chosenAction === "HOLD") {
          reward = isRecovery ? 150 : -120;
          balanceChange = isRecovery ? (Math.random() * 25) : -(Math.random() * 30);
        } else {
          reward = isRecovery ? -180 : 110; // Punish panic cutting positions right before a recovery bounce
          balanceChange = -(Math.random() * 8);
        }
      } else if (currentState === "FREE_FALL") {
        if (chosenAction === "STOP_LOSS_CUT") {
          reward = 130; // Highly reward cut strategies during a full break
          balanceChange = -(Math.random() * 12);
        } else {
          reward = -200; // Punish holding complete zero steps
          balanceChange = -(Math.random() * 80);
        }
      } else {
        reward = chosenAction === "HOLD" ? 15 : -10;
        balanceChange = chosenAction === "HOLD" ? (Math.random() * 5) : -(Math.random() * 2);
      }

      // Process and save changes back into the brain matrix (Bellman correction)
      let nextState = STATES[Math.floor(Math.random() * STATES.length)];
      let maxFutureReward = Math.max(qTable[nextState]["HOLD"], qTable[nextState]["STOP_LOSS_CUT"]);
      let currentQ = qTable[currentState][chosenAction];
      
      qTable[currentState][chosenAction] = currentQ + learningRate * (reward + (discountFactor * maxFutureReward) - currentQ);

      // Render calculations back out to interface indicators
      treasuryBalance += balanceChange;
      const balEl = document.getElementById("balance-val");
      balEl.innerText = `$${treasuryBalance.toFixed(2)}`;
      balEl.className = treasuryBalance >= 1000 ? "row-value green" : "row-value red";

      const rewEl = document.getElementById("reward-val");
      rewEl.innerText = reward >= 0 ? `+${reward} (WIN)` : `${reward} (LOSS)`;
      rewEl.className = reward >= 0 ? "row-value green" : "row-value red";

      logToTerminal(`[EPISODE ${currentCycle}] ${targetToken} ${currentState} -> Picked ${chosenAction} (${reward >= 0 ? 'WIN' : 'LOSS'})`);

      if (explorationRate > 0.05) explorationRate -= 0.005;
    }

    function startTraining() {
      if (!trainingInterval) {
